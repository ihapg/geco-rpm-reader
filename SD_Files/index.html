<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Tests HTML</title>
    <!-- local dev: /SD_Files/ + script-->
    <script src="/SD_Files/script.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Arial';
            font-size: 20px;
            text-align: center;
            justify-content: center;
        }

        table {
            width: 100%;
            background-color: #ffffffb0;
            border-collapse: collapse;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #000;
            width: 33%;
        }

        #buttonsDiv {
            margin: 10px;
            padding-right: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        #logsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        #logList {
            background: white;
            margin: 10% auto;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            text-align: center;
        }

        #logSelect {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
        }

        #downloadStatus {
            display: none;
            margin: 10px 0;
            padding: 10px;
            background: #f0f4ff;
            border-radius: 6px;
            font-size: 14px;
            color: #444;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #aaa;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin: 6px;
        }

        @keyframes spin {
            to {transform: rotate(360deg);}
        }

        #downloadProgress {
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        #downloadProgressBar {
            width: 0%;
            height: 100%;
            background: #555;
            border-radius: 3px;
            transition: width 0.3s ease;
            animation: indeterminate 1.4s ease infinite;
        }

        @keyframes indeterminate {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 60%; margin-left: 20%; }
            100% { width: 0%; margin-left: 100%; }
        }

        #downloadProgressBar.has-progress {
            animation: none;
        }

    </style>
</head>

<body>
    <h1>Agitadores GeCo</h1>
    <div id="buttonsDiv">
        <span class="spinner" id="loggingSpinner" style="display: none;"></span>
        <button id="btnOpenLogList">Registro de datos</button>
    </div>
    <div id="logsModal">
        <div id="logList">
            <h3>Seleccionar archivo</h3>
            <select id="logSelect">
                <option>Cargando...</option>
            </select>
            <br>
            <div id="downloadStatus">
                <span class="spinner"></span>
                <span id="downloadStatusText">Descargando...</span>
                <div id="downloadProgress">
                    <div id="downloadProgressBar"></div>
                </div>
            </div>

            <button id="btnDownloadLog">Descargar</button>
            <button id="btnClearLogs">Limpiar registro</button>
            <button id="btnCloseLogList">Cerrar</button>
        </div>
    </div>
    <table id="table">
        <thead>
            <tr>
                <th>Sensor</th>
                <th>RPM</th>
                <th>Hz</th>
            </tr>
        </thead>
        <tbody id="table_data"></tbody>
    </table>

</body>

</html>
